# ── 뉴스 수집 ──
gnews:
  queries:
    - "software"
    - "SaaS"
    - "AI regulation"
    - "AI policy"
    - "big tech AI"
    - "AI semiconductor GPU"
    - "software developer"
    - "AI research breakthrough"
  lang: "en"
  max_per_query: 50

# ── 뉴스레터 ──
newsletter:
  max_articles: 25
  model: "claude-sonnet-4-20250514"
  max_tokens: 4096

# ── 이메일 수신자 ──
recipients:
  daily:
    - "hsy@spri.kr"
  weekly:
    - "hsy@spri.kr"

# ── Google Drive ──
drive:
  folder_id: "1D9K1kwSogf1imTRSXv3hhoKHJmODwwsk"

# ── NotebookLM ──
notebooklm:
  notebook_prefix: "SPRi"

# ── 스케줄 ──
schedule:
  daily_time: "06:00"

# ── 웹 UI ──
web_ui:
  host: "127.0.0.1"
  port: 5000

# ── 로깅 ──
logging:
  level: "INFO"
  file: "logs/spri.log"
