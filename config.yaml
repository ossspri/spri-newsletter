# ── 뉴스 수집 ──
gnews:
  queries:
    # 기업/산업
    - "artificial intelligence"
    - "big tech AI"
    - "software industry"
    - "SaaS"
    # 정책/법제
    - "AI regulation"
    - "AI policy"
    # 인력/교육
    - "software developer AI"
    # 기술/연구
    - "AI model"
