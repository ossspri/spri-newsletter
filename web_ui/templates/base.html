<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPRi 뉴스레터 관리</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <h1 class="logo">SPRi 뉴스레터 관리</h1>
      <nav class="tabs">
        <a href="{{ url_for('daily_page') }}" class="tab {% if active_tab == 'daily' %}active{% endif %}">Daily</a>
        <a href="{{ url_for('weekly_page') }}" class="tab {% if active_tab == 'weekly' %}active{% endif %}">Weekly</a>
        <span id="nlm-badge" class="nlm-badge nlm-checking" title="NotebookLM 인증 확인 중...">NLM: 확인 중</span>
        <button class="btn-reset" onclick="resetToday()" title="오늘 생성된 아카이브와 백업 파일을 삭제합니다 (발송 이력은 보존)">오늘 생성된 기사 삭제</button>
      </nav>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <div id="loading-overlay" class="loading-overlay hidden">
    <div class="spinner"></div>
    <p id="loading-text">처리 중...</p>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script>
    function showLoading(text) {
      document.getElementById('loading-text').textContent = text || '처리 중...';
      document.getElementById('loading-overlay').classList.remove('hidden');
    }
    function hideLoading() {
      document.getElementById('loading-overlay').classList.add('hidden');
    }
    function showToast(msg, isError) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast' + (isError ? ' toast-error' : ' toast-success');
      setTimeout(() => { el.className = 'toast hidden'; }, 4000);
    }
    async function resetToday() {
      if (!confirm('오늘 날짜의 기사·아카이브·백업 파일·NotebookLM 소스를 삭제합니다.\n(발송 이력은 보존됩니다)\n\n진행하시겠습니까?')) return;
      try {
        showLoading('초기화 중... (NotebookLM 포함)');
        const data = await apiCall('/reset-today', {method: 'POST', headers: {'Content-Type': 'application/json'}});
        let msg = `${data.date} 초기화: 아카이브 ${data.archive_deleted}건`;
        msg += `, daily ${data.daily_deleted}건`;
        msg += `, manual ${data.manual_deleted}건`;
        if (data.files_deleted.length) msg += `, 파일 ${data.files_deleted.join(', ')}`;
        msg += `, NotebookLM ${data.nlm_deleted}건 삭제`;
        showToast(msg, false);
      } catch (e) {
        showToast('초기화 실패: ' + e.message, true);
      } finally {
        hideLoading();
      }
    }
    async function checkNlmAuth() {
      const badge = document.getElementById('nlm-badge');
      try {
        const resp = await fetch('/nlm/status');
        const data = await resp.json();
        if (data.valid) {
          badge.className = 'nlm-badge nlm-ok';
          badge.textContent = 'NLM: 유효';
          badge.title = data.reason + (data.login_date ? ' (로그인: ' + data.login_date + ')' : '');
        } else {
          badge.className = 'nlm-badge nlm-expired';
          badge.textContent = 'NLM: 만료';
          badge.title = data.reason;
        }
      } catch {
        badge.className = 'nlm-badge nlm-expired';
        badge.textContent = 'NLM: 오류';
        badge.title = '인증 상태 확인 실패';
      }
    }
    checkNlmAuth();

    async function apiCall(url, options) {
      const resp = await fetch(url, options);
      const data = await resp.json();
      if (!resp.ok || !data.success) {
        throw new Error(data.error || '요청에 실패했습니다.');
      }
      return data;
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
